name: Publish Node.js Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm 11.5.1 or newer, which Node 24 ships with
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve NPM dist-tag
        id: dist_tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-beta."* || "${GITHUB_REF_NAME}" == *"-beta" ]]; then
            echo "value=beta" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      # no token: npm trades the job's OIDC identity for a short-lived one, through the trusted publisher
      # configured for this workflow on npmjs.com, and attaches provenance by itself
      - name: Publish package to NPM
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.value }}
